name: MCP resource benchmark
on:
  push:
    branches:
      - benchmark/mcp-resource-profile-2026
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Benchmark actual MCP process
        run: node scripts/benchmark-resources.mjs
