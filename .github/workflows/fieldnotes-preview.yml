name: Fieldnotes preview quality gate
on:
  push:
    branches: [feat/sports-hub-vitrine-v0.9]
    paths: ['web-preview/**','.github/workflows/fieldnotes-preview.yml']
  pull_request:
    paths: ['web-preview/**']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Build production application
        run: npm run build
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser smoke test (desktop and mobile)
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 >/tmp/fieldnotes-next.log 2>&1 &
          for i in {1..30}; do
            curl -sf -o /dev/null http://127.0.0.1:3000/ && break
            sleep 2
          done
          node scripts/browser-smoke.mjs
      - name: Verify legal routes exist
        run: |
          test -f app/privacy/page.jsx
          test -f app/legal/page.jsx
          test -f app/cookies/page.jsx
          test -f app/about/page.jsx
          test -f app/api/data/route.js
          test -f app/api/chat/route.js
